bundle:
  name: pattern-a-uc-medallion

include:
  - resources/*.yml

variables:
  catalog:
    description: Target UC catalog
    default: "renjiharold_demo"
  schema:
    description: Target UC schema
    default: "portfolio"

targets:
  dev:
    default: true
    mode: development
    workspace:
      profile: DEFAULT
    variables:
      catalog: "renjiharold_demo"
      schema: "portfolio"

  prod:
    mode: production
    workspace:
      profile: DEFAULT
    variables:
      catalog: "renjiharold_demo"
      schema: "portfolio"
