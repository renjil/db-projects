bundle:
  name: 7eleven-store-intelligence

variables:
  catalog:
    description: "Unity Catalog name (required)"
  schema:
    description: "Schema/database name (required)"
  warehouse_id:
    description: "SQL Warehouse ID for queries (required)"
  genie_space_id:
    description: "Genie Space ID - create via Databricks UI first (required)"

include:
  - ./resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  staging:
    mode: development
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/prod/${bundle.name}
