      target: ${var.schema}
      development: true
      channel: CURRENT
      serverless: true
      continuous: false
      libraries:
        - file:
            path: ../src/dlt/01_silver_to_gold.sql
        - file:
            path: ../src/dlt/02_metrics_view.sql
      configuration:
        catalog: ${var.catalog}
        schema: ${var.schema}
