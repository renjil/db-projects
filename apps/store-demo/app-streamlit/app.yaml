# Databricks App manifest for the 7-Eleven Store Intelligence Streamlit app.
#
# Before `databricks apps deploy`, replace the four placeholder values below
# with your own workspace's IDs. The same catalog / schema / warehouse_id
# must match what you used in databricks.yml for the bundle deploy.
#
# See the project README for the full deployment sequence.

command: ['streamlit', 'run', 'app.py', '--server.port', '8000', '--server.address', '0.0.0.0']

env:
  - name: DATABRICKS_WAREHOUSE_ID
    value: "<YOUR_WAREHOUSE_ID>"
  - name: DATABRICKS_CATALOG
    value: "<YOUR_CATALOG>"
  - name: DATABRICKS_SCHEMA
    value: "<YOUR_SCHEMA>"
  - name: GENIE_SPACE_ID
    value: "<YOUR_GENIE_SPACE_ID>"

resources:
  - name: sql-warehouse
    sql_warehouse:
      id: "<YOUR_WAREHOUSE_ID>"
      permission: CAN_USE
