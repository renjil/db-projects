command:
  - streamlit
  - run
  - app.py
  - --server.port
  - "8000"
  - --server.address
  - 0.0.0.0

# Replace the four CHANGE_ME_* values below before `databricks apps deploy`.
# These values must match the catalog / schema / warehouse_id used in
# databricks.yml. GENIE_SPACE_ID is filled in after you create the Genie
# Space manually (see README step 4).
env:
  - name: DATABRICKS_WAREHOUSE_ID
    value: "CHANGE_ME_warehouse_id"
  - name: DATABRICKS_CATALOG
    value: "CHANGE_ME_catalog"
  - name: DATABRICKS_SCHEMA
    value: "store_demo"
  - name: GENIE_SPACE_ID
    value: "CHANGE_ME_genie_space_id"
